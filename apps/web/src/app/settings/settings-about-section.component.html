<!-- Tech Home TV: about page. The update panel, update channel, upstream
     community links and donation card are not shown. -->
<section class="settings-group" id="about">
    <header class="settings-group__header">
        <h2>{{ 'SETTINGS.ABOUT' | translate }}</h2>
        <p>{{ t().subtitle }}</p>
    </header>

    <section class="settings-section">
        <div class="settings-card">
            <div class="setting-item settings-hero" data-setting-id="version">
                <img
                    class="settings-hero__logo"
                    src="assets/branding/icon-256.png"
                    alt=""
                />
                <div class="settings-hero__text">
                    <div class="settings-hero__title">
                        <span>Tech Home TV</span>
                    </div>
                    <code class="settings-hero__version" data-test-id="app-version">
                        {{ version() }}
                    </code>
                    <small class="settings-hero__note">{{ t().tagline }}</small>
                </div>
            </div>
        </div>
    </section>

    <section class="settings-section">
        <div class="settings-section__header">
            <h3>{{ t().contactTitle }}</h3>
        </div>
        <div
            class="settings-card link-cards"
            data-setting-id="community"
            tabindex="-1"
        >
            <a
                class="link-card link-card--whatsapp"
                [href]="links().whatsapp"
                target="_blank"
                rel="noreferrer noopener"
                data-test-id="link-whatsapp"
            >
                <span class="link-card__glyph">
                    <mat-icon>chat</mat-icon>
                </span>
                <span class="link-card__text">
                    <strong>{{ t().whatsapp }}</strong>
                    <span>{{ t().whatsappDesc }}</span>
                </span>
            </a>
            <a
                class="link-card link-card--blog"
                [href]="links().website"
                target="_blank"
                rel="noreferrer noopener"
                data-test-id="link-website"
            >
                <span class="link-card__glyph">
                    <mat-icon>language</mat-icon>
                </span>
                <span class="link-card__text">
                    <strong>{{ t().website }}</strong>
                    <span>{{ t().websiteDesc }}</span>
                </span>
            </a>
        </div>
    </section>

    <div class="settings-foot" data-setting-id="tmdb-credits" tabindex="-1">
        <img src="assets/images/tmdb-logo.svg" alt="TMDB" />
        <span>{{ 'SETTINGS.TMDB_ATTRIBUTION' | translate }}</span>
    </div>

    <p class="th-credits">{{ t().credits }}</p>
</section>
