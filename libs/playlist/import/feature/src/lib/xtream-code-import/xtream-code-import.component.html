<div class="th-login">
    <img
        class="th-logo"
        src="assets/branding/logo-800.png"
        alt="Tech Home TV"
    />
    <h2>{{ t()['welcome'] }}</h2>
    <p class="th-hint">{{ t()['hint'] }}</p>

    <form [formGroup]="form">
        <mat-form-field class="w-full">
            <mat-label for="username">{{ t()['username'] }}</mat-label>
            <input
                matInput
                type="text"
                id="username"
                formControlName="username"
                autocomplete="username"
                (keydown.enter)="addPlaylist()"
            />
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label for="password">{{ t()['password'] }}</mat-label>
            <input
                matInput
                [type]="passwordToggle.inputType()"
                id="password"
                formControlName="password"
                autocomplete="current-password"
                (keydown.enter)="addPlaylist()"
            />
            <button
                mat-icon-button
                matSuffix
                type="button"
                appPasswordVisibilityToggle
                #passwordToggle="appPasswordVisibilityToggle"
                [attr.aria-label]="t()['showPassword']"
            >
                <mat-icon>{{ passwordToggle.icon() }}</mat-icon>
            </button>
        </mat-form-field>
    </form>

    @if (busy()) {
        <p class="th-status" role="status" aria-live="polite">
            {{ t()['checking'] }}
        </p>
    }
    @if (error()) {
        <p class="th-error" role="alert">{{ error() }}</p>
    }

    <div class="th-actions">
        @if (links().whatsapp) {
            <a
                class="th-btn th-btn--whatsapp"
                [href]="links().whatsapp"
                target="_blank"
                rel="noopener"
            >
                <mat-icon>chat</mat-icon>
                <span>{{ t()['whatsapp'] }}</span>
            </a>
        }
        @if (links().website) {
            <a
                class="th-btn"
                [href]="links().website"
                target="_blank"
                rel="noopener"
            >
                <mat-icon>language</mat-icon>
                <span>{{ t()['website'] }}</span>
            </a>
        }
    </div>

    <button type="button" class="th-lang" (click)="toggleLang()">
        <mat-icon>translate</mat-icon>
        <span>{{ t()['switchLang'] }}</span>
    </button>
</div>
