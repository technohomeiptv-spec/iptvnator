<div class="th-login" [attr.dir]="lang() === 'ar' ? 'rtl' : 'ltr'">
    <img
        class="th-logo"
        src="assets/branding/logo-800.png"
        alt="Tech Home TV"
    />
    <h2>{{ t()['welcome'] }}</h2>
    <p class="th-hint">{{ t()['hint'] }}</p>

    <form [formGroup]="form">
        <mat-form-field class="w-full">
            <mat-label for="username">{{ t()['username'] }}</mat-label>
            <input
                matInput
                type="text"
                id="username"
                formControlName="username"
                autocomplete="username"
                (keydown.enter)="addPlaylist()"
            />
        </mat-form-field>
        <mat-form-field class="w-full">
            <mat-label for="password">{{ t()['password'] }}</mat-label>
            <input
                matInput
                [type]="passwordToggle.inputType()"
                id="password"
                formControlName="password"
                autocomplete="current-password"
                (keydown.enter)="addPlaylist()"
            />
            <button
                mat-icon-button
                matSuffix
                type="button"
                appPasswordVisibilityToggle
                #passwordToggle="appPasswordVisibilityToggle"
                [attr.aria-label]="t()['showPassword']"
            >
                <mat-icon>{{ passwordToggle.icon() }}</mat-icon>
            </button>
        </mat-form-field>
    </form>

    @if (busy()) {
        <p class="th-status" role="status" aria-live="polite">
            {{ t()['checking'] }}
        </p>
    }
    @if (error()) {
        <p class="th-error" role="alert">{{ error() }}</p>
    }

    <div class="th-links">
        @if (links().whatsapp) {
            <a [href]="links().whatsapp" target="_blank" rel="noopener">{{
                t()['whatsapp']
            }}</a>
        }
        @if (links().website) {
            <a [href]="links().website" target="_blank" rel="noopener">{{
                t()['website']
            }}</a>
        }
        <button type="button" class="th-lang" (click)="toggleLang()">
            {{ t()['switchLang'] }}
        </button>
    </div>
</div>
