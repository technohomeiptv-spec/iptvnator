<!-- Tech Home TV: the dialog is the subscriber sign-in. The method picker
     (file / URL / text / Stalker / auto-detect), the protocol test button and
     the technical HTTP notice are removed; only the Xtream sign-in remains. -->
<div class="apd">
    <mat-dialog-content>
        <div class="apd-form-area">
            <app-xtream-code-import (addClicked)="closeDialog()" />
        </div>
    </mat-dialog-content>

    <mat-dialog-actions class="apd-actions">
        <div class="apd-actions__reset"></div>

        <div class="apd-actions__decision">
            <button mat-button type="button" (click)="closeDialog()">
                {{ 'CANCEL' | translate }}
            </button>

            <button
                mat-flat-button
                color="primary"
                type="button"
                [disabled]="
                    !xtreamImport()?.form?.valid ||
                    xtreamImport()?.isTestingConnection
                "
                (click)="xtreamImport()?.addPlaylist()"
            >
                {{ xtreamImport()?.lang() === 'en' ? 'Sign in' : 'تسجيل الدخول' }}
            </button>
        </div>
    </mat-dialog-actions>
</div>
